<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + safe-area で iPhone のホームバーを避ける -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#c69c6d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="英単語" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>英単語 — 書いて覚える</title>
    <meta
      name="description"
      content="選択肢を出さない英単語アプリ。ひらがな専用キーボードで意味を書いて答えます。大学受験レベル1,883語。オフラインで動き、学習記録は端末内だけに保存されます。"
    />

    <!--
      SNS でリンクを貼ったときの見た目（OGP / Twitter Card）。

      画像とURLは絶対パスでなければなりません。クローラーは
      HTML の場所を基準に相対パスを解決してくれないためです。
      公開先を変えるときは、ここの3か所も直してください。

      og:image は app/pwa/public/og.jpg。作り直すときは
      開発サーバーで /scripts/make-og.html を開いて保存します。
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="英単語 — 書いて覚える" />
    <meta property="og:title" content="英単語 — 書いて覚える" />
    <meta
      property="og:description"
      content="選択肢を出さない英単語アプリ。ひらがなで書いて答える。大学受験レベル1,883語、オフラインで動きます。"
    />
    <meta property="og:url" content="https://frhigh-github.github.io/kaite-oboeru/" />
    <meta
      property="og:image"
      content="https://frhigh-github.github.io/kaite-oboeru/og.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="紙に「書いて覚える」と書かれた表紙。右下にひらがなキーボードの一部"
    />
    <meta property="og:locale" content="ja_JP" />
    <!--
      X（Twitter）は og: を読めない場合に twitter: を見るので、
      両方書いておく。どちらか片方しか読まない収集器があるため。
    -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="英単語 — 書いて覚える" />
    <meta
      name="twitter:description"
      content="選択肢を出さない英単語アプリ。ひらがなで書いて答える。大学受験レベル1,883語、オフラインで動きます。"
    />
    <meta
      name="twitter:image"
      content="https://frhigh-github.github.io/kaite-oboeru/og.jpg"
    />
    <meta
      name="twitter:image:alt"
      content="紙に「書いて覚える」と書かれた表紙。右下にひらがなキーボードの一部"
    />
  </head>
  <body>
    <div id="app">
      <div class="loading">読み込み中…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
